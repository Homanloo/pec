[project]
name = "pec-web"
version = "0.1.0.dev0"
description = "Web API and site for PEC"
license = "MIT"
authors = [{ name = "Mohammad Homanloo", email = "homanloom@gmail.com" }]
requires-python = ">=3.15"
dependencies = [
    "pec",
    "django>=6.1,<6.2",
    "djangorestframework>=3.18",
    "drf-spectacular>=0.30",
    "drf-spectacular-sidecar>=2026.10",
    "whitenoise>=6.12",
    "gunicorn>=26",
]

[tool.uv.sources]
pec = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pecweb"
