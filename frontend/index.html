<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Phase equilibrium calculations with cubic equations of state: flash, bubble and dew points, phase diagrams." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Phase Equilibrium Calculator</title>
    <script>
      // Set the theme before the first paint (no flash of the wrong colours)
      try {
        const t = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
