name: ci
on:
  push:
  pull_request:
  # New advisories appear without a push: audit weekly too (Mondays 06:00 UTC).
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.55.1
      - run: uv sync --locked
      - run: just lint
      - run: just typecheck

  # Against Postgres, not SQLite: pytest-django builds the test database by
  # running every migration, and the migrate step applies them to a real one.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://pec:pec@127.0.0.1:5432/pec
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: pec, POSTGRES_PASSWORD: pec, POSTGRES_DB: pec }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pec" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.55.1
      - run: uv sync --locked
      - name: Tests with coverage
        run: just test --cov-report=xml --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - name: Migrations apply to Postgres
        run: just manage migrate --noinput
      - name: No model change without its migration
        run: just migrations
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.55.1
      - run: uv sync --locked
      - run: just audit

  # Every push builds the image and runs it the way zig1 does (read-only, no
  # capabilities, DEBUG off). Only main publishes it, after every check passed.
  image:
    if: github.event_name != 'schedule'
    needs: [lint, test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pec" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pec:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name pec --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e DJANGO_DEBUG=0 \
            -e DJANGO_SECRET_KEY=ci -e DJANGO_ALLOWED_HOSTS=localhost -p 8000:8000 pec:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8000/ && break; sleep 1; done
          for path in / /vle/ /pxy/ /pt/ /api/ /docs/ /static/style.css; do
            curl -fsS -o /dev/null -w "$path %{http_code}\n" "http://localhost:8000$path"
          done
          curl -fsS -X GET http://localhost:8000/get/ \
            -d '{"components":["nitrogen","methane"],"z":[0.4,0.6],"T_unit":"K","P_unit":"bar","T":150,"P":20,"eos_model":"PR"}' \
            | grep -q '"V": 0.8038'
      - name: Container logs
        if: failure()
        run: docker logs pec
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

  # Instant deploy: ask zig1's Watchtower to pull the new image now instead of
  # at its next poll (every 5 min, the fallback). Never fails the build.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Watchtower on zig1
        continue-on-error: true
        env:
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          if [ -z "$WATCHTOWER_TOKEN" ]; then
            echo "::warning title=deploy::WATCHTOWER_TOKEN is not set; Watchtower's poll will deploy within 5 min."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --max-time 120 \
                   -H "Authorization: Bearer $WATCHTOWER_TOKEN" \
                   https://watchtower-zig1.moripaf.ir/v1/update || echo 000)
          case "$code" in
            200) echo "zig1: updated" ;;
            401) echo "::warning title=deploy::Token rejected (401): WATCHTOWER_TOKEN differs from the infra vault." ;;
            429) echo "::warning title=deploy::A scan was already running (429); it or the next poll deploys." ;;
            000) echo "::warning title=deploy::No answer in 120 s; the scan may still finish server-side." ;;
            *)   echo "::warning title=deploy::Trigger returned $code; Watchtower's poll will deploy." ;;
          esac
