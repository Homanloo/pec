[project]
name = "pec"
version = "0.1.0"
description = "Phase Equilibrium Calculator: VLE, P-x-y and P-T diagrams with the PR and SRK equations of state"
readme = "README.md"
license = "MIT"
# numpy 1.25 has no wheels past Python 3.11.
requires-python = ">=3.11,<3.12"
dependencies = [
    "django>=5.2.17,<5.3",
    "matplotlib==3.7.2",
    "numpy==1.25.2",
    "pandas==2.0.3",
    "scipy==1.11.1",
    "whitenoise==6.7.0",
    "gunicorn==23.0.0",
    "dj-database-url>=3",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "ruff",
    "ty",
    "pip-audit",
]
notebooks = [
    "jupyter==1.0.0",
    "jupyterlab==4.0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vleW1.settings"
pythonpath = ["web-framework"]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing:skip-covered"
# collectstatic runs in the image, not before tests.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["web-framework"]
branch = true
omit = ["*/migrations/*", "*/tests.py", "web-framework/manage.py", "web-framework/vleW1/[aw]sgi.py"]

[tool.coverage.report]
fail_under = 75

[tool.ruff]
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.11"
root = ["web-framework", "tests"]

[tool.ty.src]
include = ["web-framework", "tests"]

# purePVT shares its EOS parameters through module globals on purpose.
[[tool.ty.overrides]]
include = ["web-framework/*/brain/purePVT.py"]
rules = { unresolved-global = "ignore" }
