[project]
name = "pec"
version = "0.1.0"
description = "Phase Equilibrium Calculator: VLE, P-x-y and P-T diagrams with the PR and SRK equations of state"
readme = "README.md"
license = "MIT"
# numpy 1.25 has no wheels past Python 3.11.
requires-python = ">=3.11,<3.12"
dependencies = [
    "django>=5.2.17,<5.3",
    "matplotlib==3.7.2",
    "numpy==1.25.2",
    "pandas==2.0.3",
    "scipy==1.11.1",
    "whitenoise==6.7.0",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "ruff",
    "ty",
    "pip-audit",
]
notebooks = [
    "jupyter==1.0.0",
    "jupyterlab==4.0.4",
]

[tool.uv]
package = false
