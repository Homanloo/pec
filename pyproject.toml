# uv workspace root (not a package). Members live under backend/.
[project]
name = "pec-workspace"
version = "0"
requires-python = ">=3.15"
dependencies = ["pec", "pec-web"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend/core", "backend/web"]

[tool.uv.sources]
pec = { workspace = true }
pec-web = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "ty>=0.0.97",
    "pip-audit>=2.10",
    "chemicals>=1.5.2",
    "thermo>=0.6.1",
    "coolprop>=8.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "NPY", "RUF"]
# SIM300 misreads module constants (constants.R == pytest.approx(...)) as Yoda conditions.
# RUF001-003: Unicode math notation (σ, ε, φ̂, ×) is intentional in a science codebase.
ignore = ["SIM300", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["pec", "pecweb"]

[tool.ty.environment]
python-version = "3.15"

[tool.pytest.ini_options]
testpaths = ["backend/core/tests", "backend/web/tests"]
addopts = ["--import-mode=importlib", "--cov=pec", "--cov=pecweb", "--cov-report=term-missing:skip-covered"]
# numpy warnings (overflow, invalid value) fail the test instead of hiding a NaN.
# thermo (dev-only reference) leaves its CoolProp data file open; that one is not ours.
filterwarnings = [
    "error",
    "ignore::ResourceWarning:thermo.coolprop",
    "ignore:Exception ignored while finalizing file .*thermo/CoolPropFluids:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.report]
fail_under = 90
